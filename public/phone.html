<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#060a13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Avelie">
<title>Avelie Phone</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="stylesheet" href="/css/app.css">
<link rel="preload" href="/fonts/fraunces-latin-full-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/instrument-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body class="page-phone">
<img class="backdrop" id="backdrop" alt="" aria-hidden="true" decoding="async">
<header class="top">
  <a class="brand" href="/" aria-label="Avelie, home">
    <img class="avatar" id="avatar" alt="" width="36" height="36" decoding="async">
    <span class="wordmark">Avelie</span>
  </a>
  <nav class="nav" aria-label="Sections"></nav>
</header>

<main class="phone-stage">
  <div class="phone-shell" id="phoneShell">
    <section class="lock" id="lock" aria-label="Her lock screen">
      <img class="lock-wallpaper" id="wallpaper" alt="" decoding="async">
      <div class="lock-veil" aria-hidden="true"></div>
      <div class="lock-top">
        <div class="lock-date" id="lockDate"></div>
        <div class="lock-time" id="lockTime"></div>
        <div class="lock-meta"><span class="lock-weather" id="lockWeather"></span></div>
      </div>
      <div class="np-card hidden" id="lockPlaying" aria-live="polite"></div>
      <ol class="lock-stack" id="lockStack" aria-label="Notifications"></ol>
      <div class="roll-strip hidden" id="rollStrip" aria-label="Her pictures"></div>
      <button type="button" class="home-handle home-open" id="openHome" aria-label="Her apps"><em class="home-label" aria-hidden="true">her apps</em><span aria-hidden="true"></span></button>
    </section>
    <section class="home hidden" id="home" aria-label="Her apps">
      <img class="home-wallpaper" id="homeWallpaper" alt="" decoding="async">
      <div class="home-grid" id="homeGrid">
        <a class="app" href="#maps" data-app="maps"><span class="app-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4.5l-5 2v13l5-2 6 2 5-2v-13l-5 2-6-2zM9 4.5v13M15 6.5v13"/></svg></span><span class="app-name">Maps</span></a>
        <a class="app" href="#notes" data-app="notes"><span class="app-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5h9l4 4v13H6zM15 3.5v4h4M9 12h7M9 16h5"/></svg></span><span class="app-name">Notes</span></a>
        <a class="app" href="#photos" data-app="photos"><span class="app-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 9.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zM12 9.5V4.5M12 14.5v5M9.5 12h-5M14.5 12h5M10.2 10.2L6.7 6.7M13.8 13.8l3.5 3.5M10.2 13.8l-3.5 3.5M13.8 10.2l3.5-3.5"/></svg></span><span class="app-name">Photos</span></a>
      </div>
      <nav class="home-dock" id="homeDock" aria-label="Dock">
        <a class="app" href="/" data-app="messages"><span class="app-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11.5a7.5 7.5 0 0 1-10.9 6.7L4.5 19.5l1.3-4.2A7.5 7.5 0 1 1 20 11.5z"/></svg></span><span class="app-name">Messages</span></a>
        <a class="app" href="#music" data-app="music"><span class="app-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5.5l11-2V16M9 18a3 3 0 1 1-6 0 3 3 0 0 1 6 0zM20 16a3 3 0 1 1-6 0 3 3 0 0 1 6 0z"/></svg></span><span class="app-name">Music</span></a>
      </nav>
      <button type="button" class="home-handle" id="closeHome" aria-label="Lock"><span aria-hidden="true"></span></button>
    </section>
    <section class="app-screen hidden" id="appScreen" aria-labelledby="appTitle">
      <div class="app-bar"><button type="button" class="icon-btn" id="appBack" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button><h2 class="app-title" id="appTitle"></h2></div>
      <div class="app-body" id="appBody"></div>
    </section>
  </div>
</main>

<script type="module" src="/js/nav.js"></script>
<script type="module" src="/js/phone.js"></script>
</body>
</html>
