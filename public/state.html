<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#060a13">
<title>Avelie State</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="stylesheet" href="/css/app.css">
</head>
<body class="page-state">
<header class="top">
  <a class="wordmark" href="/">AVELIE</a>
  <nav class="nav" aria-label="Sections">
    <a href="/">Chat</a>
    <a href="/state">State</a>
    <a href="/model">Model</a>
    <a href="/images">Images</a>
    <a href="/timeline">Timeline</a>
  </nav>
</header>

<main class="page">
  <div class="tabs" role="tablist">
    <button type="button" role="tab" data-tab="now">Now</button>
    <button type="button" role="tab" data-tab="life">Life</button>
    <button type="button" role="tab" data-tab="wants">Wants</button>
    <button type="button" role="tab" data-tab="history">History</button>
    <button type="button" role="tab" data-tab="facts">Facts</button>
    <button type="button" role="tab" data-tab="memory">Memory</button>
    <button type="button" role="tab" data-tab="voice">Voice</button>
    <button type="button" role="tab" data-tab="notes">Notes</button>
    <button type="button" role="tab" data-tab="unknowns">Unknowns</button>
    <button type="button" role="tab" data-tab="inbox">Inbox</button>
    <button type="button" role="tab" data-tab="rulebook">Rulebook</button>
    <button type="button" role="tab" data-tab="export">Export</button>
  </div>

  <section id="tab-now" class="stack hidden" role="tabpanel">
    <div class="chips" id="now-status"></div>
    <div class="card stack">
      <div class="row between">
        <h2 class="section-title">Mood</h2>
        <span class="chips" id="moodChips"></span>
      </div>
      <div class="grid-form">
        <label class="field">Mood
          <input type="text" id="moodInput" placeholder="fine" maxlength="200">
        </label>
        <label class="field">Mood days
          <input type="number" id="moodDays" min="1" max="14" step="1" inputmode="numeric" placeholder="3">
        </label>
        <label class="field">Cooling off until
          <input type="datetime-local" id="coolInput">
        </label>
      </div>
      <div class="row">
        <button type="button" class="btn primary" id="moodSave">Save</button>
        <button type="button" class="btn ghost" id="moodClear">Clear mood</button>
        <span class="chips" id="moodStatus"></span>
      </div>
    </div>
    <div class="cols-2">
      <div class="card stack">
        <div class="row between">
          <h2 class="section-title">Relationship</h2>
          <span class="chip accent" id="relVersion"></span>
        </div>
        <textarea id="relJson" class="code" spellcheck="false" aria-label="Relationship JSON"></textarea>
        <div class="row">
          <input type="text" id="relNote" class="grow" placeholder="Note">
          <button type="button" class="btn primary" id="relSave">Save</button>
          <span class="chips" id="relStatus"></span>
        </div>
        <h3 class="section-title">Versions</h3>
        <div class="stack tight" id="relVersions"></div>
      </div>
      <div class="card stack">
        <div class="row between">
          <h2 class="section-title">Scene</h2>
          <span class="chip accent" id="sceneVersion"></span>
        </div>
        <textarea id="sceneJson" class="code" spellcheck="false" aria-label="Scene JSON"></textarea>
        <div class="row">
          <input type="text" id="sceneNote" class="grow" placeholder="Note">
          <button type="button" class="btn primary" id="sceneSave">Save</button>
          <span class="chips" id="sceneStatus"></span>
        </div>
        <h3 class="section-title">Versions</h3>
        <div class="stack tight" id="sceneVersions"></div>
      </div>
    </div>
    <div class="card stack tight">
      <h2 class="section-title">Checks</h2>
      <div id="checksList"></div>
    </div>
  </section>

  <section id="tab-life" class="stack hidden" role="tabpanel">
    <div class="row between">
      <div class="seg small" role="group" aria-label="Status">
        <button type="button" id="lifeActive" aria-pressed="true">Active</button>
        <button type="button" id="lifeDropped" aria-pressed="false">Dropped</button>
      </div>
      <span class="chips" id="life-status"></span>
    </div>
    <div class="card stack tight" id="todayCard">
      <div class="row between">
        <h2 class="section-title">Today</h2>
        <span class="chips" id="todayNow"></span>
      </div>
      <div id="todayList"></div>
      <div class="grid-form">
        <label class="field">Kind
          <select id="todayKind">
            <option value="meal">meal</option>
            <option value="outfit">outfit</option>
            <option value="errand">errand</option>
            <option value="misc">misc</option>
          </select>
        </label>
        <label class="field">Note
          <input type="text" id="todayNote" placeholder="Note" maxlength="500">
        </label>
        <label class="field">When
          <input type="datetime-local" id="todayWhen">
        </label>
      </div>
      <div class="row">
        <button type="button" class="btn primary" id="todayAdd">Add</button>
        <span class="chips" id="todayStatus"></span>
      </div>
    </div>
    <div class="stack" id="lifeGroups"></div>
    <div class="card stack">
      <h2 class="section-title">Log</h2>
      <div id="lifeLog"></div>
      <div class="grid-form">
        <label class="field">Thread
          <select id="logThread"></select>
        </label>
        <label class="field">When
          <input type="datetime-local" id="logWhen">
        </label>
      </div>
      <textarea id="logNote" placeholder="Note" maxlength="2000"></textarea>
      <div class="row">
        <button type="button" class="btn primary" id="logAdd">Add</button>
        <span class="chips" id="logStatus"></span>
      </div>
    </div>
  </section>

  <section id="tab-history" class="stack hidden" role="tabpanel">
    <div class="chips" id="history-status"></div>
    <div class="stack" id="historyList"></div>
  </section>

  <section id="tab-facts" class="stack hidden" role="tabpanel">
    <div class="row between">
      <div class="seg small" role="group" aria-label="Filter">
        <button type="button" id="factsAll" aria-pressed="true">All</button>
        <button type="button" id="factsOpinions" aria-pressed="false">Opinions</button>
      </div>
      <span class="chips" id="facts-status"></span>
    </div>
    <div class="cols-3" id="factsColumns">
      <div class="stack">
        <h2 class="section-title">Fixed</h2>
        <div class="stack tight" id="factsFixed"></div>
      </div>
      <div class="stack">
        <h2 class="section-title">Avelie</h2>
        <div class="stack tight" id="factsAvelie"></div>
      </div>
      <div class="stack">
        <h2 class="section-title">Him</h2>
        <div class="stack tight" id="factsJustin"></div>
      </div>
    </div>
    <div class="stack tight hidden" id="factsOpinionsBox"></div>
  </section>

  <section id="tab-unknowns" class="stack hidden" role="tabpanel">
    <div class="chips" id="unknowns-status"></div>
    <div class="stack" id="unknownsList"></div>
    <div class="card stack">
      <h2 class="section-title">Add</h2>
      <input type="text" id="unknownTopic" placeholder="Topic" maxlength="200">
      <input type="text" id="unknownNote" placeholder="Note" maxlength="500">
      <div class="row"><button type="button" class="btn primary" id="unknownAdd">Add</button></div>
    </div>
  </section>

  <section id="tab-inbox" class="stack hidden" role="tabpanel">
    <div class="chips" id="inbox-status"></div>
    <div class="stack" id="inboxList"></div>
  </section>

  <section id="tab-wants" class="stack hidden" role="tabpanel">
    <div class="row between">
      <div class="filter-chips" id="wantsFilter" role="group" aria-label="Status">
        <button type="button" data-status="active" aria-pressed="true">active</button>
        <button type="button" data-status="paused" aria-pressed="false">paused</button>
        <button type="button" data-status="done" aria-pressed="false">done</button>
        <button type="button" data-status="dropped" aria-pressed="false">dropped</button>
      </div>
      <span class="chips" id="wants-status"></span>
    </div>
    <div class="stack" id="wantsList"></div>
    <div class="card stack">
      <h2 class="section-title">Add want</h2>
      <div class="grid-form">
        <label class="field">Title
          <input type="text" id="wantTitle" placeholder="Title" maxlength="200">
        </label>
        <label class="field">Progress
          <input type="number" id="wantProgress" min="0" max="100" step="1" inputmode="numeric" value="0">
        </label>
      </div>
      <input type="text" id="wantWhy" placeholder="Why" maxlength="500">
      <input type="text" id="wantStakes" placeholder="Stakes" maxlength="500">
      <input type="text" id="wantNext" placeholder="Next step" maxlength="500">
      <div class="row">
        <button type="button" class="btn primary" id="wantAdd">Add</button>
        <span class="chips" id="wantAddStatus"></span>
      </div>
    </div>
    <div class="card stack tight">
      <div class="row between">
        <h2 class="section-title">Asks</h2>
        <div class="filter-chips" id="asksFilter" role="group" aria-label="Status">
          <button type="button" data-status="open" aria-pressed="true">open</button>
          <button type="button" data-status="all" aria-pressed="false">all</button>
        </div>
      </div>
      <div id="asksList"></div>
      <div class="row">
        <input type="text" id="askText" class="grow" placeholder="Ask" maxlength="300">
        <select id="askWant" aria-label="Want"></select>
        <button type="button" class="btn" id="askAdd">Add ask</button>
        <span class="chips" id="askStatus"></span>
      </div>
    </div>
  </section>

  <section id="tab-memory" class="stack hidden" role="tabpanel">
    <div class="row between">
      <div class="filter-chips" id="memoryFilter" role="group" aria-label="Entity">
        <button type="button" data-entity="fact" aria-pressed="true">facts</button>
        <button type="button" data-entity="history" aria-pressed="false">history</button>
        <button type="button" data-entity="thread" aria-pressed="false">life</button>
        <button type="button" data-entity="log" aria-pressed="false">log</button>
        <button type="button" data-entity="want" aria-pressed="false">wants</button>
      </div>
      <span class="chips" id="memory-status"></span>
    </div>
    <div class="card memory">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Entity</th>
              <th>Text</th>
              <th>Weight</th>
              <th>Last touched</th>
              <th class="num">Touches</th>
              <th class="num">Score</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="memoryRows"></tbody>
        </table>
      </div>
    </div>
    <div class="card stack tight">
      <h2 class="section-title">Recalls</h2>
      <div id="recallsList"></div>
    </div>
  </section>

  <section id="tab-voice" class="stack hidden" role="tabpanel">
    <div class="row between">
      <div class="filter-chips" id="voiceStatusFilter" role="group" aria-label="Status">
        <button type="button" data-status="unapproved" aria-pressed="true">unapproved</button>
        <button type="button" data-status="approved" aria-pressed="false">approved</button>
        <button type="button" data-status="rejected" aria-pressed="false">rejected</button>
        <button type="button" data-status="all" aria-pressed="false">all</button>
      </div>
      <span class="chips" id="voiceCounts"></span>
    </div>
    <div class="filter-chips" id="voiceTagFilter" role="group" aria-label="Tag"></div>
    <div class="card stack tight">
      <div class="row between">
        <label class="check"><input type="checkbox" id="voiceSelectAll"> Select all</label>
        <div class="row">
          <button type="button" class="btn small" id="voiceApproveSelected">Approve selected</button>
          <button type="button" class="btn small danger" id="voiceRejectSelected">Reject selected</button>
          <button type="button" class="btn small" id="voiceApproveTag" disabled>Approve all in tag</button>
          <button type="button" class="btn small primary" id="voiceApproveAll">Approve all</button>
          <span class="chips" id="voice-status"></span>
        </div>
      </div>
      <div id="voiceList"></div>
    </div>
    <div class="card stack tight">
      <h2 class="section-title">Add line</h2>
      <input type="text" id="voiceNewText" placeholder="Line" maxlength="160">
      <div class="tag-picker" id="voiceNewTags" role="group" aria-label="Tags"></div>
      <div class="row">
        <button type="button" class="btn primary" id="voiceAdd">Add</button>
        <span class="chips" id="voiceAddStatus"></span>
      </div>
    </div>
  </section>

  <section id="tab-notes" class="stack hidden" role="tabpanel">
    <div class="row between">
      <div class="filter-chips" id="notesFilter" role="group" aria-label="Status">
        <button type="button" data-status="active" aria-pressed="true">active</button>
        <button type="button" data-status="retired" aria-pressed="false">retired</button>
        <button type="button" data-status="all" aria-pressed="false">all</button>
      </div>
      <span class="chips" id="notes-status"></span>
    </div>
    <div class="card" id="notesList"></div>
  </section>

  <section id="tab-rulebook" class="stack hidden" role="tabpanel">
    <div class="chips" id="rulebook-status"></div>
    <div class="card">
      <div class="kv">
        <span class="k">Constitution</span><span class="v mono" id="constitutionVersion"></span>
        <span class="k">Prompt</span><span class="v mono" id="promptVersion"></span>
      </div>
    </div>
    <div class="card stack hidden" id="rulebookExtra"></div>
  </section>

  <section id="tab-export" class="stack hidden" role="tabpanel">
    <div class="chips" id="export-status"></div>
    <div class="card stack">
      <h2 class="section-title">Export</h2>
      <div class="row">
        <button type="button" class="btn primary" id="exportJson">Export JSON</button>
        <button type="button" class="btn" id="exportCharacter">Character JSON</button>
        <button type="button" class="btn" id="exportBible">Character bible</button>
      </div>
    </div>
    <div class="card stack">
      <h2 class="section-title">Transcripts</h2>
      <div class="stack tight" id="transcriptList"></div>
    </div>
    <div class="card stack">
      <h2 class="section-title">Import</h2>
      <input type="file" id="importFile" accept=".json,application/json" aria-label="Import file">
      <div class="row">
        <button type="button" class="btn danger" id="importBtn">Import</button>
        <span class="chips" id="importResult"></span>
      </div>
    </div>
  </section>
</main>

<script type="module" src="/js/nav.js"></script>
<script type="module" src="/js/state.js"></script>
</body>
</html>
