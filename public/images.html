<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#060a13">
<title>Avelie Images</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="stylesheet" href="/css/app.css">
</head>
<body class="page-images">
<header class="top">
  <a class="brand" href="/" aria-label="Avelie, home">
    <img class="avatar" id="avatar" alt="" width="36" height="36" decoding="async">
    <span class="wordmark">AVELIE</span>
  </a>
  <nav class="nav" aria-label="Sections"></nav>
</header>

<main class="page">
  <div class="tabs" role="tablist">
    <button type="button" role="tab" data-tab="photos">Photos</button>
    <button type="button" role="tab" data-tab="clips">Clips</button>
    <button type="button" role="tab" data-tab="portraits">Portraits</button>
    <button type="button" role="tab" data-tab="library">Library</button>
  </div>

  <section id="tab-photos" class="stack hidden" role="tabpanel">
    <div class="chips" id="images-status"></div>

    <section class="section" id="avatarSection">
      <div class="row between">
        <h2 class="section-title">Avatar</h2>
        <span class="chips" id="avatarStatus"></span>
      </div>
      <div class="avatar-pick" id="avatarPick" role="group" aria-label="Avatar"></div>
    </section>

    <section class="section">
      <div class="row between">
        <h2 class="section-title">Masters</h2>
        <div class="row">
          <span class="chips" id="verifyAll"></span>
          <button type="button" class="btn" id="verifyBtn">Verify</button>
        </div>
      </div>
      <div class="grid-imgs" id="masters"></div>
    </section>

    <section class="section">
      <h2 class="section-title">Candidates</h2>
      <div class="grid-imgs" id="candidates"></div>
    </section>

    <section class="section">
      <h2 class="section-title">Approved</h2>
      <div class="grid-imgs" id="scenes"></div>
    </section>

    <section class="section">
      <h2 class="section-title">Rejected</h2>
      <div class="card" id="rejected"></div>
    </section>
  </section>

  <section id="tab-clips" class="stack hidden" role="tabpanel">
    <div class="chips" id="clips-status"></div>
    <div class="card stack" id="clipMake">
      <h2 class="section-title">Source</h2>
      <div class="source-picker" id="clipSources"></div>
      <textarea id="clipMotion" placeholder="Motion" maxlength="1000"></textarea>
      <div class="row">
        <button type="button" class="btn primary" id="clipGenerate">Make clip</button>
        <span class="chips" id="clip-status"></span>
      </div>
    </div>
    <div class="card stack" id="callFaceCard">
      <div class="row between">
        <h2 class="section-title">Call face</h2>
        <span class="chips" id="callFaceStatus"></span>
      </div>
      <div class="source-picker round" id="callFaceSources" role="group" aria-label="Call face source"></div>
      <div class="row">
        <button type="button" class="btn primary" id="callFaceMake">Make her call face</button>
        <span class="chips" id="callFaceMakeStatus"></span>
      </div>
      <div class="face-slots" id="faceSlots">
        <div class="face-slot" id="faceIdle" data-kind="idle">
          <span class="face-kind">Idle</span>
          <div class="stack tight" id="faceIdleBody"></div>
        </div>
        <div class="face-slot" id="faceListening" data-kind="listening">
          <span class="face-kind">Listening</span>
          <div class="stack tight" id="faceListeningBody"></div>
        </div>
        <div class="face-slot" id="faceTalking" data-kind="talking">
          <span class="face-kind">Talking</span>
          <div class="stack tight" id="faceTalkingBody"></div>
        </div>
      </div>
    </div>
    <section class="section">
      <h2 class="section-title">Candidates</h2>
      <div class="grid-imgs" id="clipCandidates"></div>
    </section>
    <section class="section">
      <h2 class="section-title">Approved</h2>
      <div class="grid-imgs" id="clipApproved"></div>
    </section>
  </section>

  <section id="tab-portraits" class="stack hidden" role="tabpanel">
    <div class="chips" id="portraits-status"></div>
    <div class="stack" id="portraitPeople"></div>
  </section>

  <section id="tab-library" class="stack hidden" role="tabpanel">
    <div class="chips" id="library-status"></div>
    <div class="card stack">
      <h2 class="section-title">Upload</h2>
      <input type="file" id="mediaFile" accept="audio/*,video/*,image/*" aria-label="Media file">
      <div class="grid-form">
        <label class="field">Title
          <input type="text" id="mediaTitle" placeholder="Title" maxlength="200">
        </label>
        <label class="field">Kind
          <select id="mediaKind">
            <option value="clip">clip</option>
            <option value="video">video</option>
            <option value="image">image</option>
            <option value="other">other</option>
          </select>
        </label>
      </div>
      <textarea id="mediaDescription" placeholder="Description" maxlength="2000"></textarea>
      <div class="row">
        <button type="button" class="btn primary" id="mediaUpload">Upload</button>
        <span class="chips" id="upload-status"></span>
      </div>
    </div>
    <div class="card" id="libraryList"></div>
  </section>
</main>

<script type="module" src="/js/nav.js"></script>
<script type="module" src="/js/images.js"></script>
</body>
</html>
