<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#060a13">
<title>Avelie Timeline</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="stylesheet" href="/css/app.css">
<link rel="preload" href="/fonts/fraunces-latin-full-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/instrument-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body class="page-timeline">
<header class="top">
  <a class="brand" href="/" aria-label="Avelie, home">
    <img class="avatar" id="avatar" alt="" width="36" height="36" decoding="async">
    <span class="wordmark">Avelie</span>
  </a>
  <nav class="nav" aria-label="Sections"></nav>
</header>

<main class="page stack">
  <header class="page-head"><h1 class="display xl">Timeline</h1><span class="chips" id="timeline-status"></span></header>
  <section class="card stack" aria-label="Timeline">
    <div class="row between">
      <label class="switch" for="logToggle"><input type="checkbox" id="logToggle"><span class="track"></span><span class="switch-label">Show the log</span></label>
      <div class="row">
        <label class="field">Kind
          <select id="kindFilter" aria-label="Kind">
            <option value="">all</option>
            <option value="history">history</option>
            <option value="photo">photo</option>
            <option value="media">media</option>
            <option value="life">life</option>
            <option value="relationship">relationship</option>
            <option value="scene">scene</option>
            <option value="first_text">first text</option>
            <option value="call">call</option>
            <option value="want">want</option>
            <option value="ask">ask</option>
            <option value="correction">note</option>
            <option value="portrait">portrait</option>
            <option value="beat">beat</option>
          </select>
        </label>
        <button type="button" class="btn small hidden" id="olderBtn">Load older</button>
      </div>
    </div>
    <div id="timelineList" aria-live="polite"></div>
    <div class="row end">
      <span class="chips" id="timeline-count"></span>
    </div>
  </section>
</main>

<script type="module" src="/js/nav.js"></script>
<script type="module" src="/js/timeline.js"></script>
</body>
</html>
