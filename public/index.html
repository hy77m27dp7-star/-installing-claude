<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#060a13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Avelie">
<title>Avelie</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="stylesheet" href="/css/app.css">
</head>
<body class="page-chat">
<header class="top">
  <a class="brand" href="/" aria-label="Avelie, home">
    <img class="avatar" id="avatar" alt="" width="36" height="36" decoding="async">
    <span class="wordmark">AVELIE</span>
  </a>
  <nav class="nav" aria-label="Sections"></nav>
</header>

<main class="chat">
  <aside class="sidebar" id="sidebar" aria-label="Conversations">
    <div class="sidebar-head">
      <button type="button" class="btn primary grow" id="newChat">New chat</button>
      <button type="button" class="btn ghost phone-only" id="closeDrawer">Close</button>
    </div>
    <ul class="conv-list" id="convList"></ul>
  </aside>

  <section class="thread-wrap">
    <div class="thread-bar">
      <button type="button" class="icon-btn phone-only" id="openDrawer" aria-controls="sidebar" aria-expanded="false" aria-label="Chats">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <span class="conv-title" id="convTitle"></span>
      <div class="bar-tools">
        <div class="menu-wrap">
          <div class="seg small" role="group" aria-label="Scene">
            <button type="button" id="sceneTogether" aria-pressed="false">Together</button>
            <button type="button" id="sceneApart" aria-pressed="false">Texting</button>
          </div>
          <div class="popover hidden" id="placesPop">
            <div class="places" id="placesList"></div>
            <input type="text" id="placeInput" placeholder="Where" maxlength="200" aria-label="Where">
            <div class="row end">
              <button type="button" class="btn small ghost" id="placeCancel">Cancel</button>
              <button type="button" class="btn small primary" id="placeSet">Together</button>
            </div>
          </div>
        </div>
        <button type="button" class="btn small pill quiet hidden" id="letHerStart">Let her start</button>
        <button type="button" class="icon-btn hidden" id="callBtn" aria-label="Call" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6.2 6.2l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 1.9z"/></svg>
        </button>
        <button type="button" class="icon-btn" id="phoneBtn" aria-label="Phone" aria-controls="phoneDrawer" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18h2"/></svg>
        </button>
        <button type="button" class="icon-btn" id="photosBtn" aria-label="Photos" aria-controls="photosDrawer" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v14H4z"/><path d="M4 16l5-5 4 4 3-3 4 4"/><path d="M15.5 9.5h.01"/></svg>
        </button>
        <div class="menu-wrap">
          <button type="button" class="icon-btn" id="moreBtn" aria-label="More" aria-haspopup="true" aria-expanded="false" aria-controls="moreMenu">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12h.01M12 12h.01M19 12h.01"/></svg>
          </button>
          <div class="menu hidden" id="moreMenu">
            <label class="switch" for="timingToggle">
              <input type="checkbox" id="timingToggle" checked>
              <span class="track"></span>
              <span class="switch-label">Human timing</span>
            </label>
            <label class="switch warm" for="operatorToggle">
              <input type="checkbox" id="operatorToggle">
              <span class="track"></span>
              <span class="switch-label">Operator</span>
            </label>
          </div>
        </div>
      </div>
    </div>

    <div class="thread" id="thread" aria-live="polite">
      <div class="typing hidden" id="typing" aria-label="Typing"><span></span><span></span><span></span></div>
    </div>

    <div class="now-playing hidden" id="nowPlaying" aria-label="Now playing" aria-hidden="true">
      <span class="np-note" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></span>
      <div class="np-text">
        <span class="np-title" id="npTitle"></span>
        <span class="np-artist" id="npArtist"></span>
        <div class="progress np-progress" id="npProgress" role="progressbar" aria-label="Position" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span></span></div>
      </div>
      <span class="np-time" id="npTime"></span>
      <button type="button" class="icon-btn" id="npPause" aria-label="Pause" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 5v14"/><path d="M15 5v14"/></svg>
      </button>
      <button type="button" class="icon-btn" id="npNext" aria-label="Next">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 5l10 7-10 7z"/><path d="M19 5v14"/></svg>
      </button>
    </div>

    <form class="composer" id="composer" autocomplete="off">
      <div class="error-row hidden" id="errorRow">
        <span class="chip danger" id="errorChip"></span>
        <button type="button" class="btn small hidden" id="retryBtn">Retry</button>
      </div>
      <div class="error-row hidden" id="lockRow">
        <span class="chip amber">Pick one first</span>
      </div>
      <div class="attach-strip hidden" id="attachStrip"></div>
      <div class="composer-box">
        <button type="button" class="icon-btn" id="attachBtn" aria-label="Attach photo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
        </button>
        <input type="file" id="fileInput" class="hidden" accept="image/jpeg,image/png,image/webp" multiple aria-label="Photos to send">
        <textarea id="input" rows="1" placeholder="Message" maxlength="4000" aria-label="Message"></textarea>
        <div class="composer-tools">
          <button type="button" class="icon-btn" id="micBtn" aria-label="Hold to record" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 11v1a7 7 0 0 1-14 0v-1"/><path d="M12 19v3"/><path d="M8 22h8"/></svg>
          </button>
          <button type="button" class="icon-btn hidden" id="tasteBtn" aria-label="Taste">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v18"/><path d="M5 7h14"/><path d="M5 7l-3 7a3 3 0 0 0 6 0z"/><path d="M19 7l-3 7a3 3 0 0 0 6 0z"/></svg>
          </button>
          <button type="submit" class="icon-btn primary" id="sendBtn" aria-label="Send">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
          </button>
        </div>
      </div>
    </form>
  </section>
</main>

<div class="scrim hidden" id="scrim"></div>

<aside class="drawer phone-drawer" id="phoneDrawer" aria-label="Phone" aria-hidden="true">
  <div class="drawer-head">
    <span class="title-row"><img class="avatar" alt="" width="28" height="28" decoding="async" data-avatar="her"><h2>Phone</h2></span>
    <button type="button" class="btn small ghost" id="phoneClose">Close</button>
  </div>
  <div class="drawer-body" id="phoneDrawerBody"></div>
</aside>

<aside class="drawer" id="photosDrawer" aria-label="Photos" aria-hidden="true">
  <div class="drawer-head">
    <h2>Photos</h2>
    <button type="button" class="btn small ghost" id="photosClose">Close</button>
  </div>
  <div class="drawer-body" id="photosList"></div>
</aside>

<section class="call-sheet hidden" id="callSheet" aria-label="Call" aria-hidden="true">
  <div class="call-head">
    <span class="status" id="callStatus">Connecting</span>
    <span class="chips" id="callReason"></span>
    <span class="timer" id="callTimer">0:00</span>
  </div>
  <div id="callFace" aria-label="Her face" aria-hidden="true"></div>
  <div class="call-captions" id="callCaptions" aria-live="polite"></div>
  <div class="call-actions">
    <button type="button" class="icon-btn" id="callMute" aria-label="Mute" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 11v1a7 7 0 0 1-14 0v-1"/><path d="M12 19v3"/><path d="M8 22h8"/></svg>
    </button>
    <button type="button" class="icon-btn end" id="callEnd" aria-label="End">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg>
    </button>
  </div>
  <audio id="callAudio" autoplay playsinline></audio>
</section>

<aside class="drawer" id="whyDrawer" aria-label="Why" aria-hidden="true">
  <div class="drawer-head">
    <h2>Why</h2>
    <button type="button" class="btn small ghost" id="whyClose">Close</button>
  </div>
  <div class="drawer-body" id="whyBody"></div>
</aside>

<script type="module" src="/js/nav.js"></script>
<script type="module" src="/js/chat.js"></script>
</body>
</html>
